# Builds the plugin zip for a version tag (v1.2.3) and attaches it to a GitHub release.
# The tag must match the "Version:" header in match-music/match-music.php.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the plugin version
        run: |
          header=$(sed -n 's/^ \* Version: *//p' match-music/match-music.php)
          constant=$(sed -n "s/^define( 'MATCH_MUSIC_VERSION', '\(.*\)' );/\1/p" match-music/match-music.php)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag $tag, header $header, constant $constant"
          test "$tag" = "$header" && test "$tag" = "$constant"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run zip

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/match-music.zip \
            --title "Match Music $GITHUB_REF_NAME" \
            --notes "Install: upload match-music.zip under Plugins > Add New > Upload, or require it with Composer (see README)."
